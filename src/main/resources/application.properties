spring.application.name=bdMetro

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/metroBD1}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Tanque.123}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MetroHikariPool

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server
server.port=8080

# Recursos estáticos (uploads)
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.static-path-pattern=/uploads/**

# Base URL
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.jackson.serialization.fail-on-empty-beans=false

# CORS origins
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200}

# Mercado Pago
mercadopago.enabled=true
mercadopago.base-url=https://api.mercadopago.com
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}
mercadopago.success-url=${MP_SUCCESS_URL:http://localhost:4200/payment-result}
mercadopago.failure-url=${MP_FAILURE_URL:http://localhost:4200/payment-result}
mercadopago.pending-url=${MP_PENDING_URL:http://localhost:4200/payment-result}

# Membership payments catalog
payments.membership.notification-path=/api/payments/memberships/mercadopago/webhook
payments.membership.default-callback-url=${MP_SUCCESS_URL:http://localhost:4200/payment-result}
payments.membership.base-plans-usd.3=10
payments.membership.base-plans-usd.6=18
payments.membership.base-plans-usd.12=30
payments.membership.catalog.AR.enabled=true
payments.membership.catalog.AR.display-name=Argentina
payments.membership.catalog.AR.currency=ARS
payments.membership.catalog.AR.document-label=DNI o CUIT
payments.membership.catalog.UY.enabled=true
payments.membership.catalog.UY.display-name=Uruguay
payments.membership.catalog.UY.currency=UYU
payments.membership.catalog.UY.document-label=CI o RUT
payments.membership.catalog.CO.enabled=true
payments.membership.catalog.CO.display-name=Colombia
payments.membership.catalog.CO.currency=COP
payments.membership.catalog.CO.document-label=CC o NIT

# PayPal
paypal.enabled=true
paypal.client-id=${PAYPAL_CLIENT_ID:BAADNcdzjAbntc8aC_wyBCUlPUCrW5doUJC2OKb18HaYQSLxJIal_T3boj-2JphOl5_G9Jb1X7g422bQDs}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:EDidyZtTNdRugltsHdKfFwZam0XLIrha28l7qU175gmMNIGjcNsIi_kdiLPteF9aCfQg_ykRABfn7oVw}
paypal.base-url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
paypal.success-url=${PAYPAL_SUCCESS_URL:http://localhost:4200/payment-result}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:4200/payment-result}

# FX
fx.base-url=https://open.er-api.com/v6/latest
fx.base-currency=USD
fx.cache-minutes=15
fx.fallback-rates.ARS=1080
fx.fallback-rates.UYU=42
fx.fallback-rates.COP=3950

# Anthropic Claude API
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Google Gemini API
