# Produccion (Railway) — las variables se inyectan desde Railway dashboard

spring.application.name=bdMetro
server.port=${PORT:8080}

# PostgreSQL — Railway inyecta PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD automaticamente
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MetroHikariPool

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=false

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:/app/uploads/
spring.mvc.static-path-pattern=/uploads/**

# URLs y CORS
app.base-url=${APP_BASE_URL}
app.cors.allowed-origins=${APP_CORS_ORIGINS}
spring.jackson.serialization.fail-on-empty-beans=false

# Logging
logging.level.root=INFO
logging.level.com.example.bdMetro=WARN

# Mercado Pago
mercadopago.enabled=true
mercadopago.base-url=https://api.mercadopago.com
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET}
mercadopago.success-url=${MP_SUCCESS_URL}
mercadopago.failure-url=${MP_FAILURE_URL}
mercadopago.pending-url=${MP_PENDING_URL}

# Membership payments catalog
payments.membership.notification-path=/api/payments/memberships/mercadopago/webhook
payments.membership.default-callback-url=${MP_SUCCESS_URL}
payments.membership.base-plans-usd.3=10
payments.membership.base-plans-usd.6=18
payments.membership.base-plans-usd.12=30
payments.membership.catalog.AR.enabled=true
payments.membership.catalog.AR.display-name=Argentina
payments.membership.catalog.AR.currency=ARS
payments.membership.catalog.AR.document-label=DNI o CUIT
payments.membership.catalog.UY.enabled=true
payments.membership.catalog.UY.display-name=Uruguay
payments.membership.catalog.UY.currency=UYU
payments.membership.catalog.UY.document-label=CI o RUT
payments.membership.catalog.CO.enabled=true
payments.membership.catalog.CO.display-name=Colombia
payments.membership.catalog.CO.currency=COP
payments.membership.catalog.CO.document-label=CC o NIT

# PayPal
paypal.enabled=true
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.base-url=${PAYPAL_BASE_URL}
paypal.success-url=${PAYPAL_SUCCESS_URL}
paypal.cancel-url=${PAYPAL_CANCEL_URL}



# FX
fx.base-url=https://open.er-api.com/v6/latest
fx.base-currency=USD
fx.cache-minutes=5
fx.fallback-rates.ARS=1100
fx.fallback-rates.UYU=43
fx.fallback-rates.COP=4300

# Anthropic Claude API
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Google Gemini API
gemini.api-key=${GEMINI_API_KEY:}
