# Servidor
spring.application.name=bdMetro

server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://switchback.proxy.rlwy.net:55307/railway}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:ECvXkIpfmUKBzNsFajgYwIISUTIIzKxK}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.web.resources.static-locations=classpath:/static/,file:/app/uploads/
spring.mvc.static-path-pattern=/uploads/**

# Aplicaci\u00F3n
# app.base-url=${APP_BASE_URL:https://localhost:8080}
app.base-url=https://adequate-education-production.up.railway.app


# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Logging
logging.level.root=INFO
logging.level.com.example.bdMetro=DEBUG

# dLocal
dlocal.enabled=${DLOCAL_ENABLED:false}
dlocal.base-url=${DLOCAL_BASE_URL:https://api.dlocal.com}
dlocal.x-login=${DLOCAL_X_LOGIN:}
dlocal.x-trans-key=${DLOCAL_X_TRANS_KEY:}
dlocal.secret-key=${DLOCAL_SECRET_KEY:}
dlocal.api-version=${DLOCAL_API_VERSION:2.1}
dlocal.user-agent=${DLOCAL_USER_AGENT:bdMetro / 1.0}

# Membership payments catalog
payments.membership.notification-path=${MEMBERSHIP_NOTIFICATION_PATH:/api/payments/memberships/dlocal/webhook}
payments.membership.default-callback-url=${MEMBERSHIP_CALLBACK_URL:https://metroapp-1c409.web.app/payment-result}
payments.membership.base-plans-usd.3=${PAYMENTS_PLAN_3_USD:5}
payments.membership.base-plans-usd.6=${PAYMENTS_PLAN_6_USD:8}
payments.membership.catalog.AR.enabled=${PAYMENTS_AR_ENABLED:true}
payments.membership.catalog.AR.display-name=Argentina
payments.membership.catalog.AR.currency=ARS
payments.membership.catalog.AR.document-label=DNI o CUIT
payments.membership.catalog.UY.enabled=${PAYMENTS_UY_ENABLED:true}
payments.membership.catalog.UY.display-name=Uruguay
payments.membership.catalog.UY.currency=UYU
payments.membership.catalog.UY.document-label=CI o RUT
payments.membership.catalog.CO.enabled=${PAYMENTS_CO_ENABLED:true}
payments.membership.catalog.CO.display-name=Colombia
payments.membership.catalog.CO.currency=COP
payments.membership.catalog.CO.document-label=CC o NIT

# FX
fx.base-url=${FX_BASE_URL:https://open.er-api.com/v6/latest}
fx.base-currency=${FX_BASE_CURRENCY:USD}
fx.cache-minutes=${FX_CACHE_MINUTES:15}
