spring.application.name=bdMetro

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/metroBD
spring.datasource.username=postgres
spring.datasource.password=Tanque.123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server
server.port=8080

# Recursos est\u00E1ticos (uploads)
spring.web.resources.static-locations=classpath:/static/,file:./uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.mvc.static-path-pattern=/uploads/**

# Base URL (para uploads)
app.base-url=http://localhost:8080
spring.jackson.serialization.fail-on-empty-beans=false

#spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# dLocal
dlocal.enabled=false
dlocal.base-url=https://sandbox.dlocal.com
dlocal.x-login=
dlocal.x-trans-key=
dlocal.secret-key=
dlocal.api-version=2.1
dlocal.user-agent=bdMetro / 1.0

# Membership payments catalog
payments.membership.notification-path=/api/payments/memberships/dlocal/webhook
payments.membership.default-callback-url=http://localhost:4200/payment-result
payments.membership.base-plans-usd.3=5
payments.membership.base-plans-usd.6=8
payments.membership.catalog.AR.enabled=true
payments.membership.catalog.AR.display-name=Argentina
payments.membership.catalog.AR.currency=ARS
payments.membership.catalog.AR.document-label=DNI o CUIT
payments.membership.catalog.UY.enabled=true
payments.membership.catalog.UY.display-name=Uruguay
payments.membership.catalog.UY.currency=UYU
payments.membership.catalog.UY.document-label=CI o RUT
payments.membership.catalog.CO.enabled=true
payments.membership.catalog.CO.display-name=Colombia
payments.membership.catalog.CO.currency=COP
payments.membership.catalog.CO.document-label=CC o NIT

# FX
fx.base-url=https://open.er-api.com/v6/latest
fx.base-currency=USD
fx.cache-minutes=15
